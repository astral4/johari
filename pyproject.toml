[project]
name = "johari"
version = "0.1.0"
description = "Tool for creating personal ranked lists of favorite Touhou characters"
requires-python = ">=3.14"
dependencies = [
    "jax>=0.11.1",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
]

[project.scripts]
johari = "johari.tui:run"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.16.5",
    "scipy-stubs>=1.18.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/johari"]

[tool.ruff]
line-length = 140
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "ISC001", "ISC003"]
allowed-confusables = ["›", "σ"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"src/johari/roster.py" = ["TRY004"]
"src/johari/selection.py" = ["TC001"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src"]
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnusedCallResult = false
